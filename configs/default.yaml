paths:
  rgb_dir: data/rgb
  depth_dir: data/depth
  masks_dir: data/yolo_masks
  sfm_dir: data/sfm
  depth_gt_dir: output_depth_tsdf  # Phase 1 output
  calib_rgb: calib/rgb_camera_info.json
  calib_depth: calib/depth_camera_info.json
  out_dir: outputs

yolo:
  weights: models/best.pt   # Path to YOLO segmentation weights
  data_config: yolo_data.yaml
  conf: 0.20                # Confidence threshold (균열 감지 민감도)
  iou: 0.45                 # NMS IoU threshold
  img_size: 1280            # Inference image size
  device: null              # e.g. "0" for GPU, null for auto
  max_det: 300              # Maximum detections per image

sfm:
  camera_model: OPENCV      # PINHOLE, OPENCV, RADIAL, SIMPLE_RADIAL
  quality: high             # low, medium, high, extreme (균열용 high 권장)
  use_gpu: true
  dense: false              # Run dense reconstruction (slow)

# Phase 1: Depth-only Ground Truth Reconstruction with Robust ICP Odometry
depth_reconstruction:
  # TSDF Volume Parameters
  tsdf_voxel_size: 0.01       # TSDF voxel size in meters (1cm = 균열 디테일 유지)
  tsdf_trunc_factor: 4.0      # Truncation distance = voxel_size * factor (3-5x typical)
  depth_trunc: 10.0           # Maximum valid depth in meters (filter far points)

  # Depth Image Parameters
  depth_unit: "auto"          # Depth unit: "m", "mm", or "auto" (auto-detect based on median value)

  # ICP Odometry Parameters
  use_icp: true               # Enable ICP for pose estimation (highly recommended for accuracy)
  icp_voxel_size: 0.02        # ICP downsample voxel size in meters (2cm = good balance)
  icp_max_corr_dist: 0.05     # ICP max correspondence distance in meters (5cm typical)
  icp_max_iterations: 50      # Maximum ICP iterations per frame

  # Undistortion (optional, usually not needed for factory-calibrated depth)
  use_undistortion: false     # Enable depth image undistortion (requires accurate distortion model)

# Phase 2: SFM Scale Alignment
scale_alignment:
  use_camera_trajectory: true  # Use camera trajectory alignment (most robust, recommended)
  use_feature_matching: true   # Use FPFH features as fallback
  max_points: 10000            # Max points for alignment (subsampling)

# Phase 3: Depth-to-RGB Alignment (DENSE MODE FOR CRACK MEASUREMENT)
align:
  in_depth_unit: "mm"      # "m", "mm", or "auto" (auto-detect)
  use_simple_resize: false   # Use proper geometric transformation with intrinsics/extrinsics
  splat_mode: "bilinear"     # "nn" or "bilinear" (서브픽셀 정확도, 균열 엣지 품질 향상)
  undistort_depth: false     # Apply depth undistortion (SDK가 이미 보정했으면 false)
  hole_fill: false           # Fill small holes (Dense mode에서 자동 채워지므로 false)
  joint_bilateral: false     # Legacy parameter (use do_dense instead)
  do_dense: true             # ✅ Enable dense completion with JBU (100% coverage + confidence map)
  plane_fill: true          # Enable RANSAC plane filling (평면 씬에서만 true)
  bilateral_d: 9             # JBU window size
  bilateral_sigma_color: 75  # JBU color sigma
  bilateral_sigma_space: 75  # JBU space sigma

# Phase 5: 3D Fusion (균열 측정 최적화)
fusion:
  voxel_size_cm: 0.1        # Coarse voxel grid (일반 영역)
  voxel_size_mm_crack: 3.0  # ✅ Fine voxel for crack ROI (3mm = 균열 폭 측정 가능)
  prob_thresh: 0.05         # Probability threshold for voxel occupancy
  weight:
    angle_cos_min: 0.3          # Minimum viewing angle cosine (0.3 = ~72° max angle)
    conf_min: 0.2               # Minimum YOLO confidence for fusion
    distance_decay_sigma: 2.0   # Distance weight decay sigma (meters)

# Phase 6: Instance Merge (중복 제거 최적화)
merge:
  dbscan_eps_voxel_mul: 2.0     # ✅ DBSCAN epsilon (복셀 크기의 배수)
                                 # 2.0 = 보수적 병합 (균열을 세밀하게 분리)
  dbscan_min_pts: 15            # ✅ Minimum points for cluster (노이즈 강력 제거)
                                 # 15 = 작은 노이즈 무시, 실제 균열만 유지
  iou_merge_thresh: 0.25        # ✅ IoU threshold for merging (중복 제거)
                                 # 0.25 = 적극적 병합 (같은 균열의 중복 제거)
  skeleton_gap_thresh_cm: 1.5   # ✅ Skeleton gap threshold (균열 연결 판정)
                                 # 1.5cm = 근처 균열만 연결 (과연결 방지)

# Reinference Settings (선택적 품질 향상)
reinfer:
  mode: auto   # off | on | auto (auto = 조건 충족 시 자동 실행)
  tile_px: 1280              # Tile size for reinference
  tile_overlap: 0.1          # Overlap ratio between tiles
  uv_resolution_mm_px: 2.0   # UV resolution (mm per pixel)
  triggers:                   # Auto reinference triggers
    gap_cm: 8.0                   # Large gap threshold (cm)
    conflict_rate: 0.15           # Conflict rate threshold
    mean_conf: 0.45               # Low mean confidence threshold
    scale_std_ratio: 0.2          # High scale variation threshold

# Phase 7: Measurement (균열 길이/폭 측정)
measure:
  crack_skeleton_smooth: true   # ✅ Enable skeleton smoothing (노이즈 제거, 깔끔한 측정)
  crack_min_length_cm: 10.0      # ✅ Minimum crack length (cm)
                                 # 3cm = 작은 노이즈 무시, 실제 균열만 측정
  area_min_m2: 0.0005           # ✅ Minimum area for area defects (m²)
                                 # 0.0005m² = 5cm² (작은 얼룩 무시)
  export_formats: ["ply", "geojson", "csv"]  # Export formats

# Class Definitions (균열 중심)
classes:
  crack: 0                  # ✅ 주요 타겟
  efflorescence: 1
  detachment: 2
  leak: 3
  spalling: 4
  material separation: 5
  rebar: 6
  damage: 7
  exhilaration: 8

# Visualization Colors
colors:
  crack: [255, 0, 0]        # Red (균열)
  efflorescence: [0, 255, 0]
  detachment: [0, 0, 255]
  leak: [255, 255, 0]
  spalling: [255, 0, 255]
  material separation: [0, 255, 255]
  rebar: [255, 128, 0]
  damage: [128, 0, 255]
  exhilaration: [0, 128, 255]
